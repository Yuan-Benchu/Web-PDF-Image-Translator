<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>沉浸式翻译</title>
<style>
  body {
    width: 260px;
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    padding: 16px;
    margin: 0;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 12px;
    color: #1a73e8;
  }
  .btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #1a73e8;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .btn.off {
    background: #e0e0e0;
    color: #333;
  }
  .row {
    font-size: 12px;
    color: #666;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
  }
  a { color: #1a73e8; text-decoration: none; }
</style>
</head>
<body>
  <h1>🅰 沉浸式翻译（简化版）</h1>
  <button id="toggleBtn" class="btn off">在此页面开启翻译</button>
  <div class="row">
    <span id="engineLabel">引擎：免费</span>
    <a href="#" id="openOptions">设置</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
