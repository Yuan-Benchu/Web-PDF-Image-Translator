<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Web Translator</title>
<style>
  *{box-sizing:border-box;}
  body{width:290px;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;padding:14px;margin:0;color:#202124;}
  h1{font-size:14px;margin:0 0 12px;color:#1a73e8;display:flex;align-items:center;gap:6px;}
  .btn{width:100%;padding:10px;border:none;border-radius:7px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer;margin-bottom:7px;}
  .btn.off{background:#e8eaed;color:#3c4043;}
  .btn.alt{background:#34a853;}
  .btn.alt2{background:#7b4fd3;}
  .btn:disabled{opacity:.55;cursor:default;}
  .sw{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border:1px solid #dadce0;border-radius:7px;margin:10px 0 7px;font-size:13px;}
  .switch{position:relative;width:38px;height:21px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:#bdc1c6;border-radius:21px;transition:.2s;cursor:pointer;}
  .slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:2.5px;background:#fff;border-radius:50%;transition:.2s;}
  input:checked + .slider{background:#1a73e8;}
  input:checked + .slider:before{transform:translateX(17px);}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#5f6368;margin-top:10px;}
  a{color:#1a73e8;text-decoration:none;cursor:pointer;}
  .note{font-size:11px;color:#80868b;margin:2px 0 0;line-height:1.4;}
</style>
</head>
<body>
  <h1>🅰 Web Translator</h1>

  <button id="toggleBtn" class="btn off">Enable translation on this page</button>

  <div class="sw">
    <span>Image OCR translation</span>
    <label class="switch">
      <input type="checkbox" id="imgToggle" />
      <span class="slider"></span>
    </label>
  </div>
  <p class="note" id="imgNote">Reads text inside images. Needs a vision-capable AI provider.</p>

  <button id="docBtn" class="btn alt2" style="margin-top:12px;">Translate editable document</button>
  <button id="pdfBtn" class="btn alt">Translate a PDF</button>

  <div class="row">
    <span id="engineLabel">Engine: Free</span>
    <a id="openOptions">Settings</a>
  </div>
</body>
<script src="popup.js"></script>
</html>
