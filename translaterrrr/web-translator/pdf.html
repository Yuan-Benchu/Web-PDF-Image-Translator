<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PDF Translator</title>
<style>
  :root{--accent:#1a73e8;--line:#dadce0;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f1f3f4;color:#202124;}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.06);flex-wrap:wrap;}
  header h1{font-size:15px;margin:0;color:var(--accent);white-space:nowrap;}
  button{padding:7px 14px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-size:13px;cursor:pointer;}
  button.ghost{background:#e8eaed;color:#3c4043;}
  button:disabled{opacity:.5;cursor:default;}
  select{padding:6px 8px;border:1px solid #ccc;border-radius:6px;font-size:13px;}
  #status{margin-left:auto;font-size:13px;color:#5f6368;}
  #drop{margin:60px auto;max-width:640px;padding:60px 24px;border:2px dashed #bdc1c6;border-radius:12px;background:#fff;text-align:center;color:#5f6368;}
  #drop.hover{border-color:var(--accent);background:#e8f0fe;}
  #pages{padding:20px 16px 60px;}

  /* side-by-side spread: translation left, original right */
  .spread{display:flex;gap:16px;justify-content:center;align-items:flex-start;margin:0 auto 26px;width:max-content;max-width:100%;}
  .side{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.15);position:relative;}
  .side-label{position:absolute;top:-19px;left:0;font-size:11px;color:#80868b;letter-spacing:.4px;}
  canvas{display:block;}
  .tlayer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  .tblock{position:absolute;color:#17324f;padding:0 2px;line-height:1.3;overflow:hidden;word-break:break-word;
          font-family:"Microsoft YaHei","PingFang SC",-apple-system,"Segoe UI",sans-serif;
          text-align:justify;hyphens:auto;}
  /* translation page is a clean white sheet, not an overlay on the scan */
  .transsheet{background:#fff;}
  .pagenum{text-align:center;font-size:12px;color:#80868b;margin:4px 0 16px;}

  /* single-page modes */
  .single{margin:0 auto 22px;width:max-content;}
  .single .tblock{background:rgba(255,255,255,.93);border-left:2px solid rgba(26,115,232,.5);color:#1558b0;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
</style>
</head>
<body>
  <header>
    <h1>PDF Translator</h1>
    <button id="pickBtn">Open PDF</button>
    <button id="translateBtn" class="ghost" disabled>Translate</button>
    <select id="viewMode">
      <option value="side">Side by side (译文 | 原文)</option>
      <option value="bilingual">Bilingual (译文在原文下方)</option>
      <option value="overlay">Overlay (译文覆盖原文)</option>
    </select>
    <button id="settingsBtn" class="ghost">Settings</button>
    <span id="status">No file loaded</span>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />
  </header>

  <div id="drop">
    <p style="font-size:16px;margin:0 0 8px">Drop a PDF here, or click <b>Open PDF</b></p>
    <p style="font-size:13px;margin:0">Rendered locally in your browser — only the extracted text is sent to your translation engine.</p>
  </div>

  <div id="pages"></div>
<script src="pdf.js"></script>
</body>
</html>
